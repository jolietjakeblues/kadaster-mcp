[project]
name = "kadaster-kkg-mcp"
version = "0.1.0"
description = "MCP-server voor de Kadaster Knowledge Graph (KKG) SPARQL-endpoint, naar analogie van rce-cho-mcp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.6.0,<2",
    "httpx>=0.27",
    "pyproj>=3.6",
    "rdflib>=7.0",
]

[project.scripts]
kadaster-kkg-mcp = "kadaster_kkg_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kadaster_kkg_mcp"]
